appId: com.arianewebdesign.subbuteo
productName: Subbuteo Scoreboard
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.sports
  # Firma ad-hoc (sin certificado de Apple): imprescindible para que arranque en Apple Silicon.
  # Si algún día se dispone de un "Developer ID Application", sustituir por esa identidad.
  identity: '-'
  # El hardened runtime solo es necesario para notarizar con Apple; con firma ad-hoc impide arrancar
  hardenedRuntime: false
  target:
    - dmg
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  category: Game
