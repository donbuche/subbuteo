<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
    <title>Ariane webdesign</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: default; user-select: none; }
      body { display: grid; place-items: center; }
      img { width: 62%; opacity: 0; transform: scale(0.96); animation: in 700ms ease-out 150ms forwards; }
      @keyframes in { to { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <img src="./images/ariane-logo.svg" alt="Ariane webdesign" />
  </body>
</html>
